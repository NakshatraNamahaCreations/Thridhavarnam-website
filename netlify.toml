# Netlify deploy config for the Thridhavarnam storefront (Next.js 14).
# The @netlify/plugin-nextjs plugin (auto-installed by Netlify) handles the
# SSR + static hybrid output — no rewrite rules needed for App Router.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Points the storefront at the deployed backend. Override in Site config
  # → Env vars if you need to swap environments without a redeploy.
  NEXT_PUBLIC_API_URL = "https://thridhavarnam-backend.onrender.com/api"
